<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-labelledby="title desc">
<title id="title">Program map / Carte du programme</title>
<desc id="desc">The common core is one session for everyone. From it, three tracks branch off: Engineering with five sessions, Product and experience with three, and Business and people with three. Overlays cross every track.</desc>
<style>
.en { font: 600 16px "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", Verdana, Arial, sans-serif; fill: #ECEFF3; }
.fr { font: 400 15px "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", Verdana, Arial, sans-serif; fill: #A9B1BD; }
.line { fill: none; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
</style>
<rect width="960" height="390" fill="#0D1117"/>
<path class="line" stroke="#3CC29C" d="M330 190 L430 90 H900"/>
<path class="line" stroke="#E08DC0" d="M330 190 L430 290 H900"/>
<path class="line" stroke="#F59A5E" d="M330 190 H900"/>
<path class="line" stroke="#6AA6F0" d="M40 190 H330"/>
<line x1="505" y1="62" x2="505" y2="318" stroke="#6B7380" stroke-width="3" stroke-dasharray="8 7"/>
<circle cx="330" cy="190" r="12" fill="#0D1117" stroke="#ECEFF3" stroke-width="4"/>
<circle cx="180" cy="190" r="8" fill="#0D1117" stroke="#6AA6F0" stroke-width="4"/>
<circle cx="580" cy="90" r="8" fill="#0D1117" stroke="#3CC29C" stroke-width="4"/><circle cx="660" cy="90" r="8" fill="#0D1117" stroke="#3CC29C" stroke-width="4"/><circle cx="740" cy="90" r="8" fill="#0D1117" stroke="#3CC29C" stroke-width="4"/><circle cx="820" cy="90" r="8" fill="#0D1117" stroke="#3CC29C" stroke-width="4"/><circle cx="900" cy="90" r="8" fill="#0D1117" stroke="#3CC29C" stroke-width="4"/>
<circle cx="580" cy="190" r="8" fill="#0D1117" stroke="#F59A5E" stroke-width="4"/><circle cx="740" cy="190" r="8" fill="#0D1117" stroke="#F59A5E" stroke-width="4"/><circle cx="900" cy="190" r="8" fill="#0D1117" stroke="#F59A5E" stroke-width="4"/>
<circle cx="580" cy="290" r="8" fill="#0D1117" stroke="#E08DC0" stroke-width="4"/><circle cx="740" cy="290" r="8" fill="#0D1117" stroke="#E08DC0" stroke-width="4"/><circle cx="900" cy="290" r="8" fill="#0D1117" stroke="#E08DC0" stroke-width="4"/>
<text x="180" y="152" class="en" text-anchor="middle">Common core, one session</text><text x="180" y="172" class="fr" text-anchor="middle">Tronc commun, une séance</text>
<text x="560" y="52" class="en" text-anchor="start">Engineering, five sessions</text><text x="560" y="72" class="fr" text-anchor="start">Parcours Génie logiciel, cinq séances</text>
<text x="560" y="152" class="en" text-anchor="start">Product and experience, three sessions</text><text x="560" y="172" class="fr" text-anchor="start">Parcours Produit et expérience, trois séances</text>
<text x="560" y="252" class="en" text-anchor="start">Business and people, three sessions</text><text x="560" y="272" class="fr" text-anchor="start">Parcours Gestion et affaires, trois séances</text>
<text x="505" y="350" class="en" text-anchor="middle">Overlays, across every track</text><text x="505" y="370" class="fr" text-anchor="middle">Modules transversaux, dans chaque parcours</text>
