<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-labelledby="title desc">
<title id="title">Program map / Carte du programme</title>
<desc id="desc">The common core is one session for everyone. From it, three tracks branch off: Engineering with five sessions, Product and experience with three, and Business and people with three. Overlays cross every track.</desc>
